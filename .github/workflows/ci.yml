name: UNI-TRACK API checks

on:
  push:
    branches:
      - main
      - fix/unitrack-recovery-contract-2026-11
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check changed recovery/auth modules
        run: |
          node --check src/utils/recoveryEnvelope.js
          node --check src/routes/auth.routes.js
      - name: Run backend tests
        run: npm test
