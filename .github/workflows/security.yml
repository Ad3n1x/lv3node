name: Backend security and quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "19 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          find src test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
